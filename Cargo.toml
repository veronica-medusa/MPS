[workspace]
resolver = "2"
members = [
    "crates/wps-core",
    "crates/wps-ooxml",
    "crates/wps-render",
    "crates/wps-writer",
    "crates/wps-sheets",
    "crates/wps-slides",
    "crates/wps-pdf",
    "crates/wps-python",
    "crates/wps-ai",
    "crates/wps-collab",
    "crates/wps-wasm",
    "src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenWPS Architects"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
unicode-segmentation = "1.12"
unicode-width = "0.2"
petgraph = "0.7"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1.11"
wasm-bindgen = "0.2"

# Internal Crate Dependencies
wps-core = { path = "crates/wps-core" }
wps-ooxml = { path = "crates/wps-ooxml" }
wps-render = { path = "crates/wps-render" }
wps-writer = { path = "crates/wps-writer" }
wps-sheets = { path = "crates/wps-sheets" }
wps-slides = { path = "crates/wps-slides" }
wps-pdf = { path = "crates/wps-pdf" }
wps-python = { path = "crates/wps-python" }
wps-ai = { path = "crates/wps-ai" }
wps-collab = { path = "crates/wps-collab" }
wps-wasm = { path = "crates/wps-wasm" }
